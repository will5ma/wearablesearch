name: IT 뉴스 자동 업데이트

on:
  schedule:
    # 매일 자정 KST (= UTC 15:00) 실행
    - cron: "0 15 * * *"
  workflow_dispatch:
    # GitHub Actions 탭에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # index.html 커밋·푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 카드 업데이트
        run: python update_news.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 변경이 없으면 커밋 스킵
          git diff --staged --quiet && echo "변경 없음, 스킵" && exit 0
          git commit -m "chore: IT 뉴스 자동 업데이트 [$(date +'%Y-%m-%d')]"
          git push
