name: 카드 자동 업데이트

on:
  schedule:
    # 매일 아침 7시 KST (= 전날 UTC 22:00) 실행 — IT 뉴스 + 펀딩 인사이트 모두 갱신
    - cron: "0 22 * * *"
  workflow_dispatch:
    # GitHub Actions 탭에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # index.html 커밋·푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: IT 뉴스 + 펀딩 인사이트 카드 업데이트
        run: python update_news.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 변경이 없으면 커밋 스킵
          git diff --staged --quiet && echo "변경 없음, 스킵" && exit 0
          git commit -m "chore: 카드 자동 업데이트 [$(date +'%Y-%m-%d')]"
          git push
