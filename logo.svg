<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#0D0D15"/>
  <!-- Border -->
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="13.25" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <!-- ECG / waveform line -->
  <polyline
    points="6,46 22,46 28,46 33,20 38,72 43,46 55,46 60,30 65,54 70,46 82,46 94,46"
    fill="none"
    stroke="#00E5C0"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- "Wearable" label -->
  <text
    x="50" y="79"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="9.5"
    font-weight="600"
    fill="#8B8B9E"
    letter-spacing="0.8"
  >Wearable</text>
  <!-- "Search" label -->
  <text
    x="50" y="93"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="12.5"
    font-weight="800"
    fill="#FFFFFF"
    letter-spacing="-0.3"
  >Search</text>
</svg>
